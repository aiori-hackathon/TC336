version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    networks:
      - app-network

  unbound:
    image: klutchell/unbound:latest 
    container_name: unbound
    ports:
      - "5335:53/udp"
      - "5335:53/tcp"
    volumes:
      - ./unbound/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
    networks:
      - app-network

  local-dns-server:
    image: node:20-alpine
    container_name: local-dns-server
    working_dir: /app
    command: sh -c "npm install dns-packet && node server.js"
    volumes:
      - ./localdns:/app
    ports:
      - "5354:53/udp"
      - "5354:53/tcp"
    networks:
      - app-network

  backend:
    build: ./Backend
    container_name: backend
    ports:
      - "3000:3000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017/dnssec_gateway
      - UNBOUND_IP=unbound
      - BIND_IP=local-dns-server
    depends_on:
      - mongodb
      - unbound
      - local-dns-server
    networks:
      - app-network

  frontend:
    build: ./Frontend
    container_name: frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge