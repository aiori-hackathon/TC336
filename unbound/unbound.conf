server:
    interface: 0.0.0.0
    port: 53
    do-ip6: no
    access-control: 0.0.0.0/0 allow
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    do-not-query-localhost: no
    username: "unbound"
    directory: "/etc/unbound"

stub-zone:
    name: "device.test"
    stub-addr: bind@53  
    stub-prime: no
    stub-first: yes